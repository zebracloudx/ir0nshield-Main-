<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronShield | Dashboard</title>
    <style>
        :root {
            --accent-cyan: #38bdf8;
            --accent-pink: #f43f5e;
            --accent-green: #4ade80;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px 15px;
            color: var(--text-main);
            background: linear-gradient(rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.9)), 
                        url('Gemini_Generated_Image_i7d7n6i7d7n6i7d7.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .dashboard-card {
            background-color: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }
        h2 {
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-cyan);
            margin-top: 0;
        }
        .bunny-container img {
            width: 140px;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            margin: 1rem 0;
        }
        .telemetry-box {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 1rem;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            margin: 1.5rem 0;
        }
        .telemetry-box h4 {
            color: var(--accent-green);
            margin: 0 0 0.5rem 0;
        }
        .telemetry-box ul {
            margin: 0;
            padding-left: 1.2rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-audio {
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .btn-audio:hover {
            background-color: var(--accent-cyan);
            color: #0b0f19;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        .btn-audio.playing {
            background-color: rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }
        .btn-logout {
            background-color: var(--accent-pink);
            color: #0b0f19;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
        }
        #audio-status-tip {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            margin-top: 6px;
        }
        @media (max-width: 480px) {
            .dashboard-card {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Audio / Music Element -->
    <audio id="bg-audio" loop preload="auto">
        <source src="sherlock_holmes.mp3" type="audio/mpeg">
    </audio>

    <div class="dashboard-card">
        <h2>WELCOME HOME! SHERLOCKS 🕵️‍♂️</h2>
        
        <div class="bunny-container">
            <img src="Gemini_Generated_Image_i7d7n6i7d7n6i7d7.png" alt="Sherlock Bunny">
        </div>
        
        <p style="color: var(--text-muted);">Congratulations!!</p>

        <div class="telemetry-box">
            <h4>📋 Session Telemetry</h4>
            <ul>
                <li><strong>Active User:</strong> admin@ironshield.io</li>
                <li><strong>Last Login:</strong> <span id="login-time">Just now</span></li>
                <li><strong>Database Sync:</strong> MongoDB Atlas Secure ✅</li>
            </ul>
        </div>

        <div class="action-buttons">
            <button type="button" id="audio-toggle-btn" onclick="toggleAudio()" class="btn-audio">🎵 Click to Play Audio Theme</button>
            <div id="audio-status-tip">Browsers require 1 click to enable audio sound</div>
            <button type="button" onclick="window.location.href='index.html'" class="btn-logout">🔒 Secure Logout</button>
        </div>
    </div>

    <script>
        document.getElementById('login-time').textContent = new Date().toLocaleTimeString();

        const audio = document.getElementById('bg-audio');
        const audioBtn = document.getElementById('audio-toggle-btn');
        const tipEl = document.getElementById('audio-status-tip');

        audio.volume = 0.85;

        // Try playing audio on page load or first user click anywhere on page
        function playAudioTrack() {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    audioBtn.textContent = '🔊 Mute Audio Theme';
                    audioBtn.classList.add('playing');
                    tipEl.textContent = '🎶 Sherlock Holmes Theme Playing';
                    tipEl.style.color = 'var(--accent-green)';
                }).catch(err => {
                    audioBtn.textContent = '🎵 Click to Play Audio Theme';
                    audioBtn.classList.remove('playing');
                    tipEl.textContent = 'Click the button above to start background music';
                    tipEl.style.color = 'var(--accent-cyan)';
                });
            }
        }

        // Trigger attempt on initial load
        window.addEventListener('DOMContentLoaded', playAudioTrack);

        // Automatic audio start on first click anywhere on dashboard
        document.body.addEventListener('click', function autoPlayOnce() {
            if (audio.paused) {
                playAudioTrack();
            }
            document.body.removeEventListener('click', autoPlayOnce);
        }, { once: true });

        function toggleAudio() {
            if (audio.paused) {
                playAudioTrack();
            } else {
                audio.pause();
                audioBtn.textContent = '🎵 Click to Play Audio Theme';
                audioBtn.classList.remove('playing');
                tipEl.textContent = 'Audio Muted';
                tipEl.style.color = 'var(--text-muted)';
            }
        }
    </script>
</body>
</html>
