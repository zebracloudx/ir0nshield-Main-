<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronShield Subneteers | Welcome Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(rgba(5, 8, 15, 0.85), rgba(5, 8, 15, 0.95)), 
                        url('IRONSHIELD SUBNETEERS.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Navigation Bar */
        .site-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
            background-color: rgba(10, 15, 30, 0.95);
            border-bottom: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ffcc;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-vid-tuts {
            background: transparent;
            border: 2px solid #ff007f;
            color: #ff007f;
            padding: 8px 18px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.8rem;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .btn-vid-tuts:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* Main Container Wrapper */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 30px 0;
        }

        .dashboard-card {
            background-color: rgba(10, 15, 30, 0.92);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #00ffcc;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        .hero-img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            background-color: rgba(5, 8, 15, 0.5);
            border-radius: 8px;
            border: 1px solid #ff007f;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        .audio-notice {
            background: rgba(255, 0, 127, 0.15);
            border: 1px dashed #ff007f;
            color: #ff007f;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.4);
        }

        .telemetry-box {
            background: rgba(5, 8, 15, 0.8);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #8be9fd;
        }

        .telemetry-box h3 {
            color: #ff007f;
            margin-top: 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 0, 127, 0.3);
            padding-bottom: 5px;
        }

        .telemetry-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.8;
        }

        .btn-logout {
            background-color: #ff007f;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #00ffcc;
            color: #05080f;
        }
    </style>
</head>
<body>

    <!-- Audio Element -->
    <audio id="login-audio" src="sherlock_holmes.mp3" preload="auto" loop></audio>

    <!-- Top Navigation Bar with VID TUTS Button on Top Right -->
    <nav class="site-nav">
        <div class="nav-brand">
            <span>🛡️</span> IRONSHIELD SUBNETEERS
        </div>
        <div class="nav-actions">
            <a href="video-tuts.html" class="btn-vid-tuts">VID TUTS</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div class="dashboard-card">
            <h1>WELCOME HOME SHERLOCKS 🕵️‍♂️</h1>
            
            <!-- SBB.jpeg Image -->
            <img src="SBB.jpeg" alt="Sherlock Holmes Terminal" class="hero-img">

            <!-- Cyber Audio Prompt Notice -->
            <div class="audio-notice" id="audio-notice">
                ⚡ [SYSTEM NOTICE]: CLICK ANYWHERE TO DECRYPT AUDIO STREAM
            </div>

            <!-- Session Telemetry -->
            <div class="telemetry-box">
                <h3>📋 Session Telemetry</h3>
                <ul>
                    <li>• <strong>Active Operator:</strong> Subneteer Secure</li>
                    <li>• <strong>System Time:</strong> <span id="login-time"></span></li>
                    <li>• <strong>Database Sync:</strong> MongoDB Atlas Secure [ONLINE] ✅</li>
                </ul>
            </div>

            <a href="admin.html" class="btn-logout">🔒 Secure Logout</a>
        </div>
    </div>

    <script>
        document.getElementById('login-time').textContent = new Date().toLocaleTimeString();

        // Automatically unlock audio and hide notice on the user's first click anywhere
        document.body.addEventListener('click', function unlockAudio() {
            const audio = document.getElementById('login-audio');
            const notice = document.getElementById('audio-notice');
            
            audio.play().then(() => {
                if (notice) {
                    notice.style.display = 'none'; // Hide the notice once music starts playing
                }
            }).catch(err => {
                console.log("Audio waiting for interaction");
            });
        }, { once: true });
    </script>
</body>
</html>
