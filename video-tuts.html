        .site-nav {

            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
            box-sizing: border-box;
        }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; /* Vertical 9:16 aspect ratio for Shorts */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
