<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronShield Subneteers | Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            color: #00ffcc;
            background: linear-gradient(rgba(5, 8, 15, 0.75), rgba(5, 8, 15, 0.85)), 
                        url('IRONSHIELD SUBNETEERS.png'),
                        url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: rgba(10, 15, 30, 0.92);
            border: 2px solid #ff007f;
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
        }

        h2 {
            color: #ff007f;
            margin-top: 0;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            color: #00ffcc;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab.active {
            background: #00ffcc;
            color: #05080f;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #8be9fd;
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(5, 8, 15, 0.8);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 6px;
            color: #00ffcc;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }

        .btn-submit {
            width: 100%;
            background-color: #00ffcc;
            color: #05080f;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px #ff007f;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #8be9fd;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        #error-msg {
            font-size: 0.8rem;
            margin-top: 1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="form-title">🔒 OPERATOR LOGIN</h2>
        
        <div class="tabs">
            <button class="tab active" id="login-tab" onclick="switchMode('login')">Login</button>
            <button class="tab" id="register-tab" onclick="switchMode('register')">Register</button>
        </div>

        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="input-group" id="username-group" style="display: none;">
                <label for="username">Operator Username</label>
                <input type="text" id="username" placeholder="e.g. Ninja">
            </div>
            <div class="input-group">
                <label for="email">Email Address (@ironshield.io)</label>
                <input type="email" id="email" required placeholder="user@ironshield.io">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Authenticate</button>
            <div id="error-msg"></div>
        </form>
        <a href="index.html" class="back-link">&larr; Back to Main Terminal</a>
    </div>

    <script>
        let isRegisterMode = false;

        function switchMode(mode) {
            const title = document.getElementById('form-title');
            const usernameGroup = document.getElementById('username-group');
            const submitBtn = document.getElementById('submit-btn');
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.textContent = "";

            if (mode === 'register') {
                isRegisterMode = true;
                title.textContent = "🛡️ REGISTER SUBNETEER";
                usernameGroup.style.display = 'block';
                submitBtn.textContent = "Create Operator Account";
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            } else {
                isRegisterMode = false;
                title.textContent = "🔒 OPERATOR LOGIN";
                usernameGroup.style.display = 'none';
                submitBtn.textContent = "Authenticate";
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value.trim();
            const errorDiv = document.getElementById('error-msg');
            
            // Client-side corporate domain enforcement
            if (!email.endsWith('@ironshield.io')) {
                errorDiv.style.color = "#ff007f";
                errorDiv.textContent = "Error: Use user@ironshield.io format!";
                return;
            }

            errorDiv.style.color = "#00ffcc";
            errorDiv.textContent = "Transmitting packet to mainframe...";

            const endpoint = isRegisterMode ? '/api/register' : '/api/test-sync';
            const payload = isRegisterMode 
                ? { username, email, password }
                : { user: email, password, action: 'ADMIN_LOGIN_TIMESTAMP', timestamp: new Date().toISOString() };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const rawText = await response.text();
                let result;
                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    result = { message: rawText || "Non-JSON server response" };
                }

                if (response.ok) {
                    errorDiv.style.color = "#00ffcc";
                    errorDiv.textContent = result.message || "Success! Redirecting...";
                    setTimeout(() => {
                        window.location.href = isRegisterMode ? 'admin.html' : 'dashboard.html';
                    }, 1000);
                } else {
                    errorDiv.style.color = "#ff007f";
                    errorDiv.textContent = result.message || "Operation failed.";
                }
            } catch (err) {
                errorDiv.style.color = "#ff007f";
                errorDiv.textContent = "Network error: " + err.message;
            }
        }
    </script>
</body>
</html>
