<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronShield Subneteers | CTF Modules</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(rgba(5, 8, 15, 0.85), rgba(5, 8, 15, 0.95)), 
                        url('IRONSHIELD SUBNETEERS.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .coming-soon-card {
            background-color: rgba(10, 15, 30, 0.92);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 45px 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #00ffcc;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        .cyber-alert {
            background: rgba(255, 230, 0, 0.15);
            border: 1px dashed #ffe600;
            color: #ffe600;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
            text-transform: uppercase;
        }

        p {
            color: #8be9fd;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-back {
            background-color: #ff007f;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-back:hover {
            background: #00ffcc;
            color: #05080f;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>
</head>
<body>
    <div class="coming-soon-card">
        <h1>🎯 CTF & TRAINING MODULES</h1>
        
        <!-- Bold Cyber Language Stay Tuned Notice -->
        <div class="cyber-alert">
      COMING SOON—STAY TUNED
        </div>

        </p>
        <a href="index.html" class="btn-back">⬅ Return to Main Terminal</a>
    </div>
</body>
</html>
